name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist
          retention-days: 7
