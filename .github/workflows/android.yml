name: android-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Use the testing keystore (installable over previous builds)
        run: cp android-keystore/debug.keystore android/app/debug.keystore
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/hexward-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: hexward-android-apk
          path: out/*.apk
          retention-days: 30
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
